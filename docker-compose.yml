version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: stock-app-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: stock-app
    volumes:
      - mongodb_data:/data/db
    networks:
      - stock-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: stock-app-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/stock-app
      JWT_SECRET: tu_secreto_super_seguro_cambiar_en_produccion
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stock-network
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: stock-app-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - stock-network

volumes:
  mongodb_data:

networks:
  stock-network:
    driver: bridge
